<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0B0F; font-family: 'Inter', sans-serif; color: #F4F5F7; }
  body { background: radial-gradient(1200px 800px at 75% 50%, #12301a 0%, #0B0B0F 60%); }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; }
  #left { width: 1060px; padding: 0 60px 0 130px; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 70px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; }
  .chip { display: inline-block; padding: 10px 22px; border-radius: 999px; background: #3DDC5C; color: #0B0B0F; font-weight: 800; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px; }
  #title { font-size: 64px; font-weight: 800; line-height: 1.1; margin-bottom: 26px; transition: opacity .35s; }
  #sub { font-size: 30px; line-height: 1.45; color: #A9AFB8; max-width: 820px; transition: opacity .35s; }
  #right { flex: 1; display: flex; justify-content: center; }
  .phone { width: 469px; height: 1000px; border-radius: 48px; background: #000; padding: 14px; box-shadow: 0 0 0 2px #2a2d33, 0 40px 120px rgba(0,0,0,.6), 0 0 80px rgba(61,220,92,.12); }
  .screen { width: 441px; height: 972px; border-radius: 34px; overflow: hidden; position: relative; background: #0B0B0F; }
  iframe { width: 390px; height: 860px; border: 0; transform: scale(1.1308); transform-origin: 0 0; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(900px 600px at 50% 45%, #143a1f 0%, #0B0B0F 70%); opacity: 0; transition: opacity .6s; pointer-events: none; }
  #card.on { opacity: 1; }
  #card img { width: 150px; height: 150px; margin-bottom: 30px; }
  #card .k { font-size: 26px; letter-spacing: 6px; color: #3DDC5C; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; }
  #card h1 { font-size: 96px; font-weight: 800; margin-bottom: 24px; }
  #card p { font-size: 34px; color: #A9AFB8; max-width: 1200px; line-height: 1.45; }
  #card .roles { display: flex; gap: 22px; margin-top: 50px; }
  #card .roles div { padding: 16px 30px; border: 2px solid #2a3a2e; border-radius: 18px; font-size: 28px; font-weight: 600; }
  .fade { opacity: 0 !important; }
  #tap { position: fixed; width: 44px; height: 44px; border-radius: 50%; background: rgba(61,220,92,.45); border: 3px solid #3DDC5C; pointer-events: none; opacity: 0; transform: translate(-50%,-50%) scale(.6); transition: opacity .15s, transform .25s; z-index: 10; }
  #tap.on { opacity: 1; transform: translate(-50%,-50%) scale(1); }
</style>
</head>
<body>
<div id="stage">
  <div id="left">
    <div class="brand"><img src="logo.png" /><span>CoreFit Gym</span></div>
    <div class="chip" id="chip">Owner</div>
    <div id="title">Title</div>
    <div id="sub">Sub</div>
  </div>
  <div id="right">
    <div class="phone"><div class="screen"><iframe id="app" src="about:blank"></iframe></div></div>
  </div>
</div>
<div id="card"></div>
<div id="tap"></div>
<script>
  window.caption = (title, sub) => {
    const t = document.getElementById('title'), s = document.getElementById('sub');
    t.classList.add('fade'); s.classList.add('fade');
    setTimeout(() => { t.textContent = title; s.textContent = sub || ''; t.classList.remove('fade'); s.classList.remove('fade'); }, 350);
  };
  window.setRole = (r) => { document.getElementById('chip').textContent = r; };
  window.card = (html) => { const c = document.getElementById('card'); if (html) { c.innerHTML = html; c.classList.add('on'); } else c.classList.remove('on'); };
  window.tap = (x, y) => { const el = document.getElementById('tap'); el.style.left = x + 'px'; el.style.top = y + 'px'; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 380); };
</script>
</body>
</html>
